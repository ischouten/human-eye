name: Validate and package VS Code
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm benchmark:performance
      - run: xvfb-run -a pnpm --filter human-eye test:integration
      - run: pnpm build
      - run: pnpm package:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: human-eye-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
