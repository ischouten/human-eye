name: Publish HumanEye for VS Code

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm benchmark:performance
      - run: xvfb-run -a pnpm --filter human-eye test:integration
      - run: pnpm package:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: human-eye-vsix
          path: apps/vscode/human-eye-*.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: visual-studio-marketplace
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: human-eye-vsix
          path: apps/vscode
      - name: Publish to Visual Studio Marketplace
        working-directory: apps/vscode
        run: pnpm exec vsce publish --oidc --packagePath human-eye-*.vsix
